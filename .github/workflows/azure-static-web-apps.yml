name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Vite bakes these into the bundle at build time; .env.local is git-ignored, so CI reads them
      # from the repository variables (Settings → Secrets and variables → Actions → Variables).
      # An empty value would ship an app that can't reach the backend, so the build stops instead.
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEMO_USER_ID: ${{ vars.VITE_DEMO_USER_ID }}
        run: |
          : "${VITE_API_BASE_URL:?Set the VITE_API_BASE_URL repository variable}"
          : "${VITE_DEMO_USER_ID:?Set the VITE_DEMO_USER_ID repository variable}"
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
